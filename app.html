<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tracker</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-sec: #8e8e93;
            --border-color: #2c2c2e;
            --c-orange: #ff9f0a;
            --c-green: #30d158;
            --c-red: #ff453a;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; padding-top: 180px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-main); user-select: none; }
        
        /* Fixed Header */
        .header { position: fixed; top: 0; left: 0; right: 0; background-color: var(--bg-color); z-index: 100; border-bottom: 1px solid var(--border-color); }
        
        /* Nav */
        .week-nav-container { display: flex; align-items: center; padding: 10px 5px; }
        .nav-btn { background: none; border: none; color: var(--text-sec); font-size: 20px; padding: 10px; cursor: pointer; }
        .week-nav { display: flex; flex: 1; justify-content: space-between; overflow: hidden; touch-action: pan-y; }
        .day { display: flex; flex-direction: column; align-items: center; flex: 1; padding: 8px 0; cursor: pointer; border-radius: 8px; color: var(--text-sec); }
        .day.active { background-color: #2c2c2e; color: var(--text-main); }
        .day-l { font-size: 12px; margin-bottom: 4px; font-weight: 500; }
        .day-n { font-size: 16px; font-weight: 600; }
        
        /* Macros */
        .macros-panel { display: flex; justify-content: space-between; padding: 10px 15px 15px; }
        .macro { flex: 1; text-align: center; padding: 0 5px; }
        .macro-val { font-size: 13px; margin-bottom: 6px; font-weight: 500; white-space: nowrap; }
        .macro-val span { color: var(--text-sec); }
        .bar-bg { width: 100%; height: 4px; background-color: #333; border-radius: 2px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s ease; }
        
        /* Lists */
        .list-container { padding: 10px 15px 30px; }
        .section-title { font-size: 13px; color: var(--text-sec); margin: 20px 0 10px 5px; text-transform: uppercase; letter-spacing: 1px; }
        
        /*.item-card { background-color: var(--panel-bg); border-radius: 10px; margin-bottom: 10px; padding: 14px 15px; display: flex; align-items: center; border: 1px solid var(--border-color); transition: opacity 0.2s; }*/
        .item-card { background-color: var(--panel-bg); border-radius: 10px; margin-bottom: 5px; padding: 5px 15px; display: flex; align-items: center; border: 1px solid var(--border-color); transition: opacity 0.2s; }
        .item-card.dragging { opacity: 0.5; border: 1px dashed var(--text-sec); }
        
        .drag-handle { color: #555; padding-right: 15px; font-size: 20px; cursor: grab; font-weight: bold; }
        .item-info { flex: 1; min-width: 0; }
        .item-name { font-size: 15px; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .item-macros { font-size: 12px; color: var(--text-sec); margin: 0; }
        
        .delete-btn { background: none; border: none; color: var(--c-red); font-size: 20px; padding-left: 15px; cursor: pointer; }
        
        /* Diferenciación visual de listas */
        #logged-list .item-card { 
            border-left: 4px solid var(--c-green); /* Borde verde para lo ya consumido */
            padding-left: 11px; /* Compensa el grosor del borde para mantener la simetría */
        }
        #food-list .item-card { 
            opacity: 0.85; /* Alimentos disponibles ligeramente más tenues */
            background-color: #161618; /* Fondo sutilmente más oscuro para la "búsqueda" */
        }

        .food-controls { display: flex; align-items: center; background-color: #000; border-radius: 8px; padding: 4px; border: 1px solid var(--border-color); }
        .ctrl-btn { background: none; border: none; color: var(--text-main); font-size: 18px; width: 30px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .ctrl-val { width: 24px; text-align: center; font-size: 14px; font-weight: 600; }
    </style>
</head>

            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

	    const activeGoal = { "kcal": 2700, "p": 130, "c": 348, "f": 90 }; // El objetivo que edites
	    const hoy = getFmtDate(new Date());
	    
	    if (!trackerDB[dateStr]) {
		trackerDB[dateStr] = { "goal": activeGoal, "entries": [] };
	    } else if (dateStr >= hoy && trackerDB[dateStr].entries.length === 0) {
		trackerDB[dateStr].goal = activeGoal; // Lo actualiza hoy si no hay registros
	    }
	}

            ensureDateExists(selectedDateStr);

        // Navigation
        function renderWeek() {
            const nav = document.getElementById('week-nav');
            nav.innerHTML = '';
            const letters = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
            
            let startOfWeek = new Date(baseDate);
            startOfWeek.setDate(baseDate.getDate() - baseDate.getDay());

            for (let i = 0; i < 7; i++) {
                let d = new Date(startOfWeek);
                d.setDate(startOfWeek.getDate() + i);
                let dStr = getFmtDate(d);
                
                let dayDiv = document.createElement('div');
                dayDiv.className = `day ${dStr === selectedDateStr ? 'active' : ''}`;
                dayDiv.onclick = () => { selectedDateStr = dStr; updateAll(); };
                dayDiv.innerHTML = `
                    <div class="day-l">${letters[i]}</div>
                    <div class="day-n">${d.getDate()}</div>
                `;
                nav.appendChild(dayDiv);
            }
        }

        function shiftWeek(offset) {
            baseDate.setDate(baseDate.getDate() + (offset * 7));
            updateAll();
        }

        function setupSwipe() {
            const container = document.getElementById('nav-container');
            container.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
            container.addEventListener('touchend', e => {
                let touchEndX = e.changedTouches[0].screenX;
                if (touchStartX - touchEndX > 50) shiftWeek(1);
                if (touchEndX - touchStartX > 50) shiftWeek(-1);
            });
        }

            if (pct > 107) return 'var(--c-red)';
            if (pct >= 95) return 'var(--c-green)';
            return 'var(--c-orange)';
        }*/
        function getColor(pct, type) {
                switch (type) {
                    case 'K': // Kcal: Te puedes pasar hasta un 10% máximo (110%) para volumen limpio
                        if (pct > 110) return 'var(--c-red)';
                        if (pct >= 95) return 'var(--c-green)';
                        return 'var(--c-orange)';
                
                    case 'P': // Proteínas: Llegar es verde, pasarse hasta un 30% (130%) sigue siendo verde (seguro)
                        if (pct > 110) return 'var(--c-red)'; // Exceso innecesario que desplaza otros macros
                        if (pct >= 80) return 'var(--c-green)';
                        return 'var(--c-orange)';
                
                    case 'C': // Carbohidratos: Margen de exceso del 10% máximo (110%) para evitar ganar grasa
                        if (pct > 110) return 'var(--c-red)';
                        if (pct >= 90) return 'var(--c-green)';
                        return 'var(--c-orange)';
            
                    case 'G': // Grasas (Palta): Margen extendido del 15% máximo (115%) por ser grasas saludables
                        if (pct > 110) return 'var(--c-red)';
                        if (pct >= 90) return 'var(--c-green)';
                        return 'var(--c-orange)';
                }
        }

        function renderMacros() {
            const panel = document.getElementById('macros-panel');
            let data = trackerDB[selectedDateStr];
            
            let totals = { kcal: 0, p: 0, c: 0, f: 0 };
            data.entries.forEach(e => {
                totals.kcal += e.kcal; totals.p += e.p; totals.c += e.c; totals.f += e.f;
            });

            const renderMacro = (val, goal, label, letter) => {
                let pct = goal ? (val / goal) * 100 : 0;
                //let color = getColor(pct);
                let color = getColor(pct, letter);
                let w = Math.min(pct, 100);
                return `
                    <div class="macro">
                        <div class="macro-val" style="color: ${color}">${val.toLocaleString('en-US')}<span>/${goal.toLocaleString('en-US')} ${letter}</span></div>
                        <div class="bar-bg"><div class="bar-fill" style="width: ${w}%; background-color: ${color}"></div></div>
                    </div>
                `;
            };

            panel.innerHTML = `
                ${renderMacro(totals.kcal, data.goal.kcal, 'Kcal', 'K')}
                ${renderMacro(totals.p, data.goal.p, 'Proteína', 'P')}
                ${renderMacro(totals.c, data.goal.c, 'Carbos', 'C')}
                ${renderMacro(totals.f, data.goal.f, 'Grasas', 'G')}
            `;
        }

        // Drag & Drop Handlers
        let dragSrcEl = null;
        function handleDragStart(e) {
            dragSrcEl = this;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.id);
            setTimeout(() => this.classList.add('dragging'), 0);
        }
        function handleDragOver(e) { e.preventDefault(); return false; }
        function handleDragEnter(e) { e.preventDefault(); }
        function handleDragEnd(e) { this.classList.remove('dragging'); }
        function handleDrop(e) {
            e.stopPropagation();
            let target = e.target.closest('.item-card');
            if (dragSrcEl !== target && target) {
                let srcId = dragSrcEl.dataset.id;
                let tgtId = target.dataset.id;
                let entries = trackerDB[selectedDateStr].entries;
                
                let srcIdx = entries.findIndex(x => x.id === srcId);
                let tgtIdx = entries.findIndex(x => x.id === tgtId);
                
                let [moved] = entries.splice(srcIdx, 1);
                entries.splice(tgtIdx, 0, moved);
                
                entries.forEach((ent, i) => ent.order = i + 1);
                updateAll();
            }
            return false;
        }

        // Logged Foods
        function renderLogged() {
            const list = document.getElementById('logged-list');
            list.innerHTML = '';
            let entries = trackerDB[selectedDateStr].entries.sort((a,b) => a.order - b.order);

            entries.forEach(e => {
                let card = document.createElement('div');
                card.className = 'item-card';
                card.draggable = true;
                card.dataset.id = e.id;
                
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('dragenter', handleDragEnter);
                card.addEventListener('dragend', handleDragEnd);
                card.addEventListener('drop', handleDrop);

card.innerHTML = `
    <div class="drag-handle">≡</div>
    <div class="item-info">
        <p class="item-name" style="display:flex; justify-content:space-between; align-items:center; margin:0;">
          <span>${e.label}</span> 
          <span class="item-macros" style="margin-left:10px; white-space:nowrap;">${e.kcal}K | ${e.p}P | ${e.c}C | ${e.f}G</span>
        </p>
    </div>
    <button class="delete-btn" onclick="removeEntry('${e.id}')">✕</button>
`;
                list.appendChild(card);
            });
        }

        // Food DB List
        function renderFoodList() {
            const list = document.getElementById('food-list');
            list.innerHTML = '';
            let entries = trackerDB[selectedDateStr].entries;

            foodDB.forEach(food => {
                let count = entries.filter(e => e.id_food === food.id).length;
                let card = document.createElement('div');
                card.className = 'item-card';

card.innerHTML = `
    <div class="item-info">
        <p class="item-name" style="display:flex; justify-content:space-between; align-items:center; margin:0;">
            <span>${food.label}</span>
            <span class="item-macros" style="margin-left:10px; margin-right: 15px; white-space:nowrap;">${food.kcal}K | ${food.p}P | ${food.c}C | ${food.f}G</span>
        </p>
    </div>
    <div class="food-controls">
        <button class="ctrl-btn" onclick="addRemoveFood('${food.id}', -1)">-</button>
        <div class="ctrl-val">${count}</div>
        <button class="ctrl-btn" onclick="addRemoveFood('${food.id}', 1)">+</button>
    </div>
`;
                list.appendChild(card);
            });
        }

        // Actions
        function removeEntry(id) {
            let entries = trackerDB[selectedDateStr].entries;
            trackerDB[selectedDateStr].entries = entries.filter(e => e.id !== id);
            trackerDB[selectedDateStr].entries.forEach((ent, i) => ent.order = i + 1);
            updateAll();
        }

        function addRemoveFood(foodId, action) {
            let entries = trackerDB[selectedDateStr].entries;
            if (action === 1) {
                let food = foodDB.find(f => f.id === foodId);
                entries.push({
                    id: Math.random().toString(16).slice(2, 10),
                    id_food: food.id,
                    order: entries.length + 1,
                    label: food.label,
                    kcal: food.kcal, p: food.p, c: food.c, f: food.f
                });
            } else {
                let idx = entries.map(e => e.id_food).lastIndexOf(foodId);
                if (idx !== -1) entries.splice(idx, 1);
                entries.forEach((ent, i) => ent.order = i + 1);
            }
            updateAll();
        }
    </script>
</body>
</html>
