<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --panel: #1c1c1e;
            --text: #fff;
            --muted: #8e8e93;
            --border: #2c2c2e;
            --orange: #ff9f0a;
            --green: #30d158;
            --light-green: #9be5ae;
            --light-orange: #ffcb7c;
            --red: #ff453a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 115px 0 30px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .header {
            position: fixed;
            inset: 0 0 auto;
            z-index: 1;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }

        .week-nav-container,
        .week-nav,
        .macros-panel,
        .macro,
        .item-card,
        .food-controls {
            display: flex;
            align-items: center;
        }

        .week-nav-container {
            padding: 8px 5px;
        }

        .week-nav {
            flex: 1;
            justify-content: space-between;
        }

        .nav-btn,
        .ctrl-btn,
        .delete-btn {
            color: var(--text);
            background: none;
            border: 0;
            cursor: pointer;
        }

        .nav-btn {
            padding: 8px 32px;
            color: var(--muted);
            font-size: 22px;
        }

        .day {
            flex: 1;
            padding: 7px 0;
            text-align: center;
            color: var(--muted);
            border-radius: 8px;
            cursor: pointer;
            border: 0;
            background: transparent;
            font: inherit;
        }

        .day.active {
            color: var(--text);
            background: var(--border);
        }

        .day-l {
            font-size: 12px;
        }

        .day-n {
            margin-top: 3px;
            font-size: 16px;
            font-weight: 600;
        }

        .macros-panel {
            justify-content: space-between;
            padding: 8px 12px 14px;
        }

        .macro {
            flex: 1;
            flex-direction: column;
            padding: 0 4px;
        }

        .macro-val {
            margin-bottom: 5px;
            font-size: 18px;
            white-space: nowrap;
        }

        .macro-val span {
            color: var(--muted);
        }

        .bar-bg {
            width: 100%;
            height: 4px;
            overflow: hidden;
            background: #333;
            border-radius: 2px;
        }

        .bar-fill {
            height: 100%;
            border-radius: 2px;
        }

        .list-container {
            padding: 8px 14px 24px;
        }

        #api-status {
            min-height: 18px;
            color: var(--muted);
            font-size: 13px;
        }

        .section-title {
            margin: 20px 0 10px 5px;
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 1px;
        }

        .item-card {
            gap: 10px;
            margin-bottom: 5px;
            padding: 4px 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        #logged-list .item-card {
            border-left: 4px solid var(--green);
        }

        #food-list .item-card {
            background: #161618;
        }

        .item-info {
            flex: 1;
            min-width: 0;
        }

        .item-name {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin: 0;
            font-size: 14px;
        }

        .item-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item-macros {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .delete-btn {
            color: var(--red);
            font-size: 20px;
        }

        .food-controls {
            flex-shrink: 0;
            gap: 5px;
            padding: 0px 4px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .ctrl-btn {
            width: 28px;
            height: 26px;
            font-size: 18px;
        }

        .ctrl-btn:disabled {
            color: #555;
            cursor: default;
        }

        .ctrl-val {
            width: 18px;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <header class="header" id="app-header" hidden>
        <div class="week-nav-container" id="nav-container">
            <button class="nav-btn" type="button" aria-label="Semana anterior" onclick="shiftWeek(-1)">‹</button>
            <div class="week-nav" id="week-nav"></div>
            <button class="nav-btn" type="button" aria-label="Semana siguiente" onclick="shiftWeek(1)">›</button>
        </div>
        <div class="macros-panel" id="macros-panel"></div>
    </header>

    <main class="list-container" id="app-content" hidden>
        <div id="logged-list"></div>
        <h2 class="section-title">CATALOG:</h2>
        <div id="food-list"></div>
    </main>

    <p id="api-status" role="status" aria-live="polite"></p>

    <button id="btnActivate" type="button" hidden onclick="requestActivation()">SOLICITAR ACTIVACIÓN</button>
    <button id="btnDesactivate" type="button" hidden onclick="deleteActivation()">BORRAR DISPOSITIVO</button>

    <script src="config.js"></script>
    <script>

        // foodDB local queda desactivada: el catálogo se carga con GET /catalogs.
        const params = new URLSearchParams(window.location.search);
        const environment = params.get('env') || 'aws';
        const API_URL = window.TRACKER_CONFIG?.[environment];
        if (!API_URL) {
            document.body.textContent = 'Entorno inválido. Usa ?env=local o ?env=aws.';
            throw new Error('Usa ?env=local o ?env=aws.');
        }

        let activationId = localStorage.getItem('activationId');
        let userId = localStorage.getItem('userId');

        const today = new Date();
        const todayString = formatDate(today);
        const savedDate = localStorage.getItem('selectedDate');
        let selectedDate = isValidDate(savedDate) ? savedDate : todayString;
        let weekDate = dateFromString(selectedDate);
        let catalogFoods = [];
        let loggedFoods = [];
        let dailyGoal = { k: 0, p: 0, c: 0, f: 0 };
        let dailyTotals = { k: 0, p: 0, c: 0, f: 0 };
        let touchStartX = 0;

        document.addEventListener('DOMContentLoaded', start);

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function dateFromString(dateString) {
            const [year, month, day] = dateString.split('-').map(Number);
            return new Date(year, month - 1, day);
        }

        function isValidDate(value) {
            if (!value || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
            return formatDate(dateFromString(value)) === value;
        }

        function showStatus(message, isError = false) {
            const status = document.getElementById('api-status');
            status.textContent = message;
            status.style.color = isError ? 'var(--red)' : 'var(--muted)';
        }

        async function requestApi(path, options = {}) {
            const headers = new Headers(options.headers || {});
            const userId = localStorage.getItem('userId');
            if (userId) headers.set('X-User-Id', userId);

            const response = await fetch(`${API_URL}${path}`, { ...options, headers });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || `Error ${response.status}`);
            return result;
        }

        function showApp(isActive) {
            document.getElementById('app-header').hidden = !isActive;
            document.getElementById('app-content').hidden = !isActive;
            //SI LA APP SE MUESTRA SOLO LA PODEMOS DESACTIVAR
            document.getElementById('btnDesactivate').hidden = !isActive;
            //SI LA APP NO SE MUESTRA SOLO LA PODEMOS ACTIVAR
            document.getElementById('btnActivate').hidden = isActive;
        }

        async function checkActivation() {
            if (!activationId) {
                activationId = crypto.randomUUID();
                localStorage.setItem('activationId', activationId);
            }

            showApp(false);
            showStatus('Verificando activación...');

            try {
                const activation = await requestApi(
                    `/activations?activationId=${encodeURIComponent(activationId)}`
                );

                if (activation.Status === 'ACTIVE') {
                    localStorage.setItem('userId', activation.UserId);
                    showApp(true);
                    showStatus(`UserId: ${activation.UserId}`);
                    return true;
                }

                showApp(false);
                showStatus(`Dispositivo inactivo: ${activationId}`);
                return false;
            } catch (error) {
                showApp(false);
                showStatus(`No se pudo verificar la activación: ${error.message}`, true);
                return false;
            }
        }

        async function requestActivation() {
            const button = document.getElementById('btnActivate');
            //button.disabled = true;
            showStatus('Enviando solicitud...');

            try {
                await requestApi('/activations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ activationId })
                });
                await checkActivation();
            } catch (error) {
                //button.disabled = false;
                showStatus(`No se pudo solicitar la activación: ${error.message}`, true);
            }
        }

        function deleteActivation() {
            if (!confirm(`Desea borrar ${activationId}? La reactivación requiere verificación.`)) {
                return;
            }
            localStorage.removeItem('activationId');
            localStorage.removeItem('userId');
            localStorage.removeItem('sessionTime');
            window.location.reload();
        }

        async function start() {
            if (!await checkActivation()) return;
            setupSwipe();
            renderWeek();
            localStorage.setItem('selectedDate', selectedDate);
            showStatus('Cargando catálogo...');
            try {
                catalogFoods = await requestApi('/catalogs');
                renderFoodList();
                await loadSelectedDate();
            } catch (error) {
                showStatus(`No se pudo conectar con la API: ${error.message}`, true);
            }
        }

        async function loadSelectedDate() {
            localStorage.setItem('selectedDate', selectedDate);
            renderWeek();
            showStatus('Cargando día...');
            const requestedDate = selectedDate;
            const query = `?date=${encodeURIComponent(requestedDate)}`;

            try {
                const [goal, logsResponse] = await Promise.all([
                    requestApi(`/goals${query}`),
                    requestApi(`/logs${query}`)
                ]);
                // Si se eligió otro día durante la carga, no mostrar la respuesta anterior.
                if (requestedDate !== selectedDate) return;

                dailyGoal = goal || { k: 0, p: 0, c: 0, f: 0 };
                dailyTotals = logsResponse.totals || { k: 0, p: 0, c: 0, f: 0 };
                loggedFoods = logsResponse.logs || [];
                renderMacros();
                renderLogged();
                renderFoodList();
                showStatus('');
            } catch (error) {
                showStatus(`No se pudieron cargar los datos: ${error.message}`, true);
            }
        }

        function renderWeek() {
            const nav = document.getElementById('week-nav');
            nav.replaceChildren();
            const letters = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
            const start = new Date(weekDate);
            start.setDate(start.getDate() - start.getDay());

            for (let index = 0; index < 7; index += 1) {
                const date = new Date(start);
                date.setDate(start.getDate() + index);
                const dateString = formatDate(date);
                const day = document.createElement('button');
                day.type = 'button';
                day.className = `day${dateString === selectedDate ? ' active' : ''}`;
                day.innerHTML = `<div class="day-l">${letters[index]}</div><div class="day-n">${date.getDate()}</div>`;
                day.addEventListener('click', () => {
                    selectedDate = dateString;
                    loadSelectedDate();
                });
                nav.appendChild(day);
            }
        }

        // ########################################################
        // ###   FIX TO NOT CHANGE DATE TO CHANGE WEEK - START  ###
        // ########################################################
        function shiftWeek(offset) {
            weekDate.setDate(weekDate.getDate() + offset * 7);
            renderWeek();
        }
        // #######################################################
        // ###   FIX TO NOT CHANGE DATE TO CHANGE WEEK - END   ###
        // #######################################################

        function setupSwipe() {
            const container = document.getElementById('nav-container');
            container.addEventListener('touchstart', event => {
                touchStartX = event.changedTouches[0].screenX;
            });
            container.addEventListener('touchend', event => {
                const touchEndX = event.changedTouches[0].screenX;
                if (touchStartX - touchEndX > 50) shiftWeek(1);
                if (touchEndX - touchStartX > 50) shiftWeek(-1);
            });
        }

        /*function macroColor(percent, type) {
            if (percent > 110) return 'var(--red)';
            if (type === 'K' && percent >= 95) return 'var(--green)';
            if ((type === 'C' || type === 'F') && percent >= 90) return 'var(--green)';
            if (type === 'P' && percent >= 80) return 'var(--green)';
            return 'var(--orange)';
        }*/

        function macroColor(percent, type) {
            if (type === 'F' && percent > 130) return 'var(--red)';
            if (percent > 120) return type === 'P' || type === 'F' ? 'var(--orange)' : 'var(--red)';
            if (percent > 110) return 'var(--orange)'; // pre alerta
            if (type === 'P' && percent >= 95) return 'var(--green)'; // minimo aceptable
            if (type === 'K' && percent >= 95) return 'var(--green)'; // minimo aceptable
            if (type === 'C' && percent >= 90) return 'var(--green)'; // minimo aceptable
            if (type === 'F' && percent >= 85) return 'var(--green)'; // minimo aceptable
            if ((type === 'P' || type === 'K') && percent >= 85) return 'var(--light-green)'; // minimo absoluto P y K
            if (percent >= 75) return 'var(--light-green)';  // minimo absoluto C y F
            return 'var(--light-orange)'; //pendiente light-orange
        }

        function renderMacros() {
            const panel = document.getElementById('macros-panel');
            const macros = [
                ['k', 'K'], ['p', 'P'], ['c', 'C'], ['f', 'F']
            ];
            panel.replaceChildren();

            macros.forEach(([field, letter]) => {
                const value = Number(dailyTotals[field] || 0);
                const goal = Number(dailyGoal[field] || 0);
                const percent = goal ? value / goal * 100 : 0;
                const color = macroColor(percent, letter);
                const macro = document.createElement('div');
                macro.className = 'macro';
                macro.innerHTML = `
                    <div class="macro-val" style="color:${color}">${value.toLocaleString('en-US')}<span>/${goal.toLocaleString('en-US')} ${letter}</span></div>
                    <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(percent, 100)}%;background:${color}"></div></div>`;
                panel.appendChild(macro);
            });
        }

        function createMealInfo(meal, isCatalog = false) {
            const info = document.createElement('div');
            info.className = 'item-info';
            const name = document.createElement('p');
            name.className = 'item-name';
            const label = document.createElement('span');
            label.className = 'item-label';
            label.textContent = meal.label;
            const macros = document.createElement('span');
            macros.className = 'item-macros';
            macros.textContent = `${meal.k}K | ${meal.p}P | ${meal.c}C | ${meal.f}F`;
            if (isCatalog) macros.style.marginRight = '5px';
            name.append(label, macros);
            info.appendChild(name);
            return info;
        }

        function renderLogged() {
            const list = document.getElementById('logged-list');
            list.replaceChildren();
            loggedFoods.forEach(meal => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.appendChild(createMealInfo(meal));
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'delete-btn';
                button.textContent = '✕';
                button.setAttribute('aria-label', `Eliminar ${meal.label}`);
                button.addEventListener('click', () => removeMeal(meal.SK));
                card.appendChild(button);
                list.appendChild(card);
            });
        }

        function sameMeal(first, second) {
            return first.label === second.label && first.k === second.k &&
                first.p === second.p && first.c === second.c && first.f === second.f;
        }

        function renderFoodList() {
            const list = document.getElementById('food-list');
            list.replaceChildren();
            catalogFoods.forEach(food => {
                const matchingLogs = loggedFoods.filter(log => sameMeal(log, food));
                const card = document.createElement('div');
                card.className = 'item-card';
                card.appendChild(createMealInfo(food, true));

                const controls = document.createElement('div');
                controls.className = 'food-controls';
                const removeButton = document.createElement('button');
                removeButton.type = 'button';
                removeButton.className = 'ctrl-btn';
                removeButton.textContent = '-';
                removeButton.disabled = matchingLogs.length === 0;
                removeButton.addEventListener('click', () => removeMeal(matchingLogs[matchingLogs.length - 1].SK));
                const count = document.createElement('span');
                count.className = 'ctrl-val';
                count.textContent = matchingLogs.length;
                const addButton = document.createElement('button');
                addButton.type = 'button';
                addButton.className = 'ctrl-btn';
                addButton.textContent = '+';
                addButton.setAttribute('aria-label', `Agregar ${food.label}`);
                addButton.addEventListener('click', () => addMeal(food));
                controls.append(removeButton, count, addButton);
                card.appendChild(controls);
                list.appendChild(card);
            });
        }

        async function addMeal(food) {
            showStatus('Guardando comida...');
            try {
                await requestApi(`/logs?date=${encodeURIComponent(selectedDate)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        Type: 'MEAL',
                        Details: { label: food.label, k: food.k, p: food.p, c: food.c, f: food.f }
                    })
                });
                await loadSelectedDate();
            } catch (error) {
                showStatus(`No se pudo guardar: ${error.message}`, true);
            }
        }

        async function removeMeal(SK) {
            showStatus('Eliminando comida...');
            try {
                await requestApi('/logs', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ SK })
                });
                await loadSelectedDate();
            } catch (error) {
                showStatus(`No se pudo eliminar: ${error.message}`, true);
            }
        }
    </script>
</body>

</html>
